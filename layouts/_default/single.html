{{ define "main" }}
  <article>
    <header class="page-header">
      <div class="container page-header__inner">
        <p class="eyebrow">{{ .Section }}</p>
        <h1>{{ .Title }}</h1>
        {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
      </div>
    </header>
    <div class="container section prose">{{ .Content }}</div>
  </article>
{{ end }}

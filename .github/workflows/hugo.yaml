name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Hugo shells out to the Tailwind CLI from node_modules to build the
      # stylesheet, so the dependencies have to be present before the build.
      - name: Install build dependencies
        run: npm ci

      - name: Install Hugo
        run: |
          curl -fsSL -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${{ runner.temp }}/hugo"
          tar -xzf "${{ runner.temp }}/hugo.tar.gz" -C "${{ runner.temp }}/hugo"
          echo "${{ runner.temp }}/hugo" >> "${GITHUB_PATH}"

      - name: Build site
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Browsers cannot hyphenate Mongolian, so justified text gets its soft
      # hyphens written in here, after Hugo has produced the pages.
      - name: Hyphenate Mongolian text
        run: node scripts/hyphenate.mjs public

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
